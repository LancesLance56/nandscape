services:
  postgres:
    image: postgres:16-alpine
    container_name: my-monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nandscape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nandscape -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sandboxed execution of reader-submitted code for /practices.
  #
  # Replaces Piston, whose image is published for linux/amd64 only and so will
  # not run on an arm64 server. This service runs each submission in a
  # throwaway container built from an official language image; those are
  # multi-arch, so the identical engine runs natively on an amd64 dev machine
  # and an arm64 host. One engine across both environments matters more than
  # the architecture on its own - a judge that differs between them hides
  # timing bugs until production.
  #
  # No `ports:` block. Unlike postgres above, this is never published to the
  # host, so the only thing that can reach it is another service on this
  # network - the web app, and nothing else.
  #
  # The Docker socket is mounted here and nowhere else. It is root-equivalent
  # on the host, which is exactly why it belongs to a service that does one
  # thing and never sees an HTTP request from the outside world; the web
  # container handles untrusted submissions and must not hold it. On a shared
  # host, put a socket proxy in front of this and allow only container
  # create/start/wait/logs/inspect/remove.
  runner:
    build:
      context: ./services/runner
    container_name: nandscape-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Bounds this service itself. The per-submission containers it spawns carry
    # their own --memory/--cpus and are not children of this cgroup.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:2000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # One-shot image puller: the runner needs each language image present before
  # a submission can run. Its own profile so it works against either stack.
  #   docker compose --profile bootstrap run --rm engine-prepare
  engine-prepare:
    profiles: ["bootstrap"]
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - "for i in python:3.12-alpine node:22-alpine gcc:14; do echo \"pulling $$i\"; docker pull \"$$i\"; done"
    restart: "no"

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://nandscape:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/app_db
      NODE_ENV: development
      WEB_PORT: "${WEB_PORT:-3000}"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SEED_SECRET: "${SEED_SECRET:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CI: "true"
      WATCHPACK_POLLING: "1000"
      RUNNER_URL: "http://runner:2000"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/auth/node_modules
      - /app/packages/db/node_modules
      - /app/packages/engine/node_modules
      - /app/apps/web/.next

  # `docker compose --profile prod up --build` - built standalone `next start`.
  web:
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      target: runner
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://nandscape:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/app_db
      NODE_ENV: production
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SEED_SECRET: "${SEED_SECRET:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      RUNNER_URL: "http://runner:2000"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy

volumes:
  postgres_data:
  # Language runtimes Piston installs on first boot. Persisted so a restart
  # does not re-download them.
  piston_packages: