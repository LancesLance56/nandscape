services:
  postgres:
    image: postgres:16-alpine
    container_name: my-monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nandscape
      POSTGRES_PASSWORD: LancesLance56
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: